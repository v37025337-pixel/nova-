[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-cognitive-kernel"
version = "0.3.0"
description = "Persistent, bounded native program-learning kernel informed by YADO"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.scripts]
nova = "nova_core.__main__:main"

[tool.setuptools.packages.find]
include = ["nova_core*"]
