[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-cognitive-kernel"
version = "1.1.0"
description = "Unified NOVA runtime with shared memory, logic, planning and verified program learning"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.scripts]
nova = "nova_core.cognition.__main__:main"
nova-legacy = "nova_core.__main__:main"
nova-read-code = "nova_tools.code_reader_bridge:main"
nova-next = "nova_next.__main__:main"

[tool.setuptools.packages.find]
include = ["nova_core*", "nova_tools*", "nova_next*"]

[tool.setuptools.package-data]
nova_next = ["inherited.json", "seed_blueprint.json"]
"nova_core.cognition" = ["bootstrap*.json.gz", "upstream_licenses/*.txt", "upstream_licenses/sources.json"]
