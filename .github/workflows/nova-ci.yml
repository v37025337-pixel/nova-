name: NOVA kernel verification

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_release.py
      - run: python -m nova_core --state /tmp/nova-ci.sqlite learn examples/three_generations.json --steps 3
      - run: python -m nova_core --state /tmp/nova-ci.sqlite verify
      - name: Restore and replay trained generation 8
        if: matrix.python == '3.12'
        run: python scripts/run_development_chain.py --restore experience/development-chain-v1/journal.json --state /tmp/nova-trained-ci.sqlite
      - name: Restore and replay evolved generation 12
        if: matrix.python == '3.12'
        run: python scripts/run_development_chain.py --restore experience/engine-cycle-v2/journal.json --state /tmp/nova-evolved-ci.sqlite
