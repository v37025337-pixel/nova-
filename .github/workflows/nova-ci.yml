name: NOVA kernel verification

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_release.py
      - name: Replay Nova Next external-source admissions
        if: matrix.python == '3.12'
        run: python scripts/verify_nova_next.py
      - name: Replay unified cognition, inherited candidate and combined plan
        if: matrix.python == '3.12'
        run: python scripts/verify_unified.py
      - run: python -m nova_core --state /tmp/nova-ci.sqlite learn examples/three_generations.json --steps 3
      - run: python -m nova_core --state /tmp/nova-ci.sqlite verify
      - name: Restore and replay trained generation 8
        if: matrix.python == '3.12'
        run: python scripts/run_development_chain.py --restore experience/development-chain-v1/journal.json --state /tmp/nova-trained-ci.sqlite
      - name: Restore and replay evolved generation 12
        if: matrix.python == '3.12'
        run: python scripts/run_development_chain.py --restore experience/engine-cycle-v2/journal.json --state /tmp/nova-evolved-ci.sqlite
      - name: Replay historical 0.3 capability admission
        if: matrix.python == '3.12'
        run: python scripts/run_development_chain.py --restore experience/capability-cycle-v3/result/mechanism/journal.json --state /tmp/nova-word-ci.sqlite
      - name: Restore and replay generated algorithm generation 14
        if: matrix.python == '3.12'
        run: python scripts/run_development_chain.py --restore experience/algorithm-cycle-v4/result/journal.json --state /tmp/nova-algorithm-ci.sqlite
      - name: Restore G20 history and replay Python composition and transfer through G22
        if: matrix.python == '3.12'
        run: python scripts/run_development_chain.py --restore experience/python-learning-v1/journal.json --state /tmp/nova-python-learning-ci.sqlite
      - name: Replay the G22 observation-originated goal and retained failed search
        if: matrix.python == '3.12'
        run: python scripts/run_development_chain.py --restore experience/observation-goals-v1/journal.json --state /tmp/nova-observation-goals-ci.sqlite
      - name: Replay UCR 16 observations and the retained negative search
        if: matrix.python == '3.12'
        run: |
          python -c 'import gzip,pathlib; pathlib.Path("/tmp/nova-ucr-journal.json").write_bytes(gzip.decompress(pathlib.Path("experience/ucr-v16-integration/journal.json.gz").read_bytes()))'
          python scripts/run_development_chain.py --restore /tmp/nova-ucr-journal.json --state /tmp/nova-ucr-ci.sqlite
      - name: Replay the v8 upgrade and active UCR development search
        if: matrix.python == '3.12'
        run: |
          python -c 'import gzip,pathlib; pathlib.Path("/tmp/nova-ucr-development-journal.json").write_bytes(gzip.decompress(pathlib.Path("experience/ucr-development-v1/journal.json.gz").read_bytes()))'
          python scripts/run_development_chain.py --restore /tmp/nova-ucr-development-journal.json --state /tmp/nova-ucr-development-ci.sqlite
      - name: Replay the UCR 18 runtime upgrade and continued G22 search
        if: matrix.python == '3.12'
        run: |
          python -c 'import gzip,pathlib; pathlib.Path("/tmp/nova-ucr18-journal.json").write_bytes(gzip.decompress(pathlib.Path("experience/ucr18-integration/journal.json.gz").read_bytes()))'
          python scripts/run_development_chain.py --restore /tmp/nova-ucr18-journal.json --state /tmp/nova-ucr18-ci.sqlite
      - name: Replay the retained G22 continuation and supplied UCR v25 graph import
        if: matrix.python == '3.12'
        run: |
          python -c 'import gzip,pathlib; pathlib.Path("/tmp/nova-codeflow-journal.json").write_bytes(gzip.decompress(pathlib.Path("experience/codeflow-v25-integration/journal.json.gz").read_bytes()))'
          python scripts/run_development_chain.py --restore /tmp/nova-codeflow-journal.json --state /tmp/nova-codeflow-ci.sqlite
